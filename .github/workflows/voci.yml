# Registra con le voci naturali le frasi dell'"Orario raccontato" (avatar.html).
# Parte da solo quando il programma "Gestione Orario" pubblica una settimana nuova (dati/settimana.json),
# e ogni 2 ore riprova le frasi che il servizio delle voci avesse rifiutato.
name: Voci dell'orario raccontato

on:
  push:
    branches: [main]
    paths:
      - 'dati/settimana.json'
      - 'dati/corsi.json'
      - 'racconto.js'
      - 'guide.js'
      - 'strumenti/**'
      - '.github/workflows/voci.yml'
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voci
  cancel-in-progress: true

jobs:
  voci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Programma delle voci
        run: pip install edge-tts
      - name: Registra le frasi della settimana
        continue-on-error: true
        timeout-minutes: 15
        run: |
          node strumenti/frasi.js > /tmp/frasi.json
          python strumenti/voci.py /tmp/frasi.json
      - name: Mette le registrazioni sul sito
        run: |
          git config user.name "Voci LUTE"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio
          if git diff --cached --quiet; then echo "Niente di nuovo da salvare"; exit 0; fi
          git commit -m "Voci registrate per l'orario raccontato"
          git pull --rebase
          git push
